<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Gitma</title>
  <desc id="desc">A Figma file where a designer has just added size xl to the Button component set, with the new variant selected and its values shown in the properties panel. Next to it, Gitma names the drift in the terminal, and Button.tsx receives the same change as a one-line diff.</desc>
  <defs>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="220%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#1A1814" flood-opacity="0.10"/>
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#1A1814" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L8 5 L1 9" fill="none" stroke="#D9A23A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <g id="component-icon">
      <path d="M0 -6.5 L2.5 -4 L0 -1.5 L-2.5 -4 Z M0 1.5 L2.5 4 L0 6.5 L-2.5 4 Z M-6.5 0 L-4 -2.5 L-1.5 0 L-4 2.5 Z M1.5 0 L4 -2.5 L6.5 0 L4 2.5 Z"/>
    </g>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>

  <!-- canvas -->
  <rect width="1200" height="680" rx="24" fill="#F3F2EE"/>

  <!-- figma window -->
  <g filter="url(#shadow)">
    <rect x="48" y="56" width="640" height="568" rx="16" fill="#FFFFFF"/>
  </g>
  <path d="M48 104 H488 V624 H64 a16 16 0 0 1 -16 -16 Z" fill="#F7F6F3"/>
  <rect x="48.5" y="56.5" width="639" height="567" rx="15.5" fill="none" stroke="#E4E1DA"/>
  <line x1="48" y1="104.5" x2="688" y2="104.5" stroke="#ECEAE4"/>
  <line x1="488.5" y1="104" x2="488.5" y2="624" stroke="#ECEAE4"/>

  <!-- toolbar -->
  <path d="M72 72 L72 88 L76.5 84 L79.5 90.5 L82 89.3 L79 83 L85 82.5 Z" fill="#8C8880"/>
  <path d="M102 74 V90 M110 74 V90 M98 78 H114 M98 86 H114" stroke="#8C8880" stroke-width="1.6" stroke-linecap="round"/>
  <text x="128" y="89" class="sans" font-size="17" font-weight="600" fill="#8C8880">T</text>
  <text x="368" y="85" text-anchor="middle" class="sans" font-size="13" fill="#56534D">Design System <tspan fill="#B4B1AA">/ Components</tspan></text>

  <!-- component set -->
  <use href="#component-icon" x="88" y="205" fill="#9747FF"/>
  <text x="102" y="210" class="sans" font-size="13" font-weight="500" fill="#9747FF">Button</text>
  <rect x="80" y="222" width="376" height="284" rx="6" fill="#FFFFFF" stroke="#9747FF" stroke-width="1.5" stroke-dasharray="5 4"/>

  <g class="sans" font-weight="500" fill="#FFFFFF" text-anchor="middle">
    <rect x="108" y="250" width="76" height="28" rx="6" fill="#26262B"/>
    <text x="146" y="268.5" font-size="12">Button</text>
    <rect x="108" y="298" width="92" height="34" rx="7" fill="#26262B"/>
    <text x="154" y="319.5" font-size="14">Button</text>
    <rect x="108" y="352" width="110" height="40" rx="8" fill="#26262B"/>
    <text x="163" y="377.5" font-size="16">Button</text>
    <rect x="108" y="412" width="128" height="48" rx="9" fill="#26262B"/>
    <text x="172" y="442" font-size="18">Button</text>
  </g>

  <g class="mono" font-size="12" fill="#8C8880">
    <text x="268" y="268">size=sm</text>
    <text x="268" y="319">size=md</text>
    <text x="268" y="376">size=lg</text>
    <text x="268" y="440" fill="#0D99FF" font-weight="600">size=xl</text>
  </g>

  <!-- the new variant, selected -->
  <rect x="105" y="409" width="134" height="54" fill="none" stroke="#0D99FF" stroke-width="1.5"/>
  <g fill="#FFFFFF" stroke="#0D99FF" stroke-width="1.5">
    <rect x="102" y="406" width="6" height="6"/>
    <rect x="236" y="406" width="6" height="6"/>
    <rect x="102" y="460" width="6" height="6"/>
    <rect x="236" y="460" width="6" height="6"/>
  </g>
  <path d="M214 448 L214 466 L218.8 461.8 L222 468.6 L224.6 467.4 L221.4 460.8 L227.8 460.2 Z" fill="#0D99FF" stroke="#FFFFFF" stroke-width="1.2" stroke-linejoin="round"/>
  <rect x="226" y="468" width="72" height="22" rx="11" fill="#0D99FF"/>
  <text x="262" y="483" text-anchor="middle" class="sans" font-size="12" font-weight="500" fill="#FFFFFF">Designer</text>

  <!-- properties panel -->
  <use href="#component-icon" x="514" y="132" fill="#9747FF"/>
  <text x="528" y="137" class="sans" font-size="14" font-weight="600" fill="#18181B">Button</text>
  <line x1="488" y1="156.5" x2="688" y2="156.5" stroke="#ECEAE4"/>

  <text x="508" y="186" class="sans" font-size="11" font-weight="600" letter-spacing="0.06em" fill="#8C8880">PROPERTIES</text>

  <text x="508" y="214" class="sans" font-size="12" fill="#56534D">label</text>
  <rect x="508" y="224" width="160" height="28" rx="6" fill="#F3F2EE"/>
  <text x="518" y="242.5" class="sans" font-size="12" fill="#18181B">Button</text>

  <text x="508" y="291" class="sans" font-size="12" fill="#56534D">disabled</text>
  <rect x="640" y="279" width="28" height="16" rx="8" fill="#DAD7CF"/>
  <circle cx="648" cy="287" r="6" fill="#FFFFFF"/>

  <text x="508" y="330" class="sans" font-size="12" fill="#56534D">size</text>
  <rect x="508" y="340" width="160" height="28" rx="6" fill="#F3F2EE"/>
  <text x="518" y="358.5" class="sans" font-size="12" fill="#18181B">xl</text>
  <path d="M650 351 L654 355 L658 351" fill="none" stroke="#8C8880" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="508" y="410" class="sans" font-size="11" fill="#8C8880">Values</text>
  <g class="sans" font-size="12" text-anchor="middle">
    <rect x="508" y="424" width="34" height="26" rx="6" fill="#F3F2EE"/>
    <text x="525" y="441" fill="#56534D">sm</text>
    <rect x="546" y="424" width="34" height="26" rx="6" fill="#F3F2EE"/>
    <text x="563" y="441" fill="#56534D">md</text>
    <rect x="584" y="424" width="34" height="26" rx="6" fill="#F3F2EE"/>
    <text x="601" y="441" fill="#56534D">lg</text>
    <rect x="622.75" y="424.75" width="38.5" height="24.5" rx="5.25" fill="#0D99FF" fill-opacity="0.1" stroke="#0D99FF" stroke-width="1.5"/>
    <text x="642" y="441" fill="#0D99FF" font-weight="600">xl</text>
  </g>

  <!-- connector -->
  <path d="M666 437 H 718" fill="none" stroke="#D9A23A" stroke-width="1.6" stroke-dasharray="2 5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="666" cy="437" r="3.5" fill="#D9A23A"/>

  <!-- terminal -->
  <g filter="url(#shadow)">
    <rect x="724" y="103" width="428" height="168" rx="14" fill="#18181B"/>
  </g>
  <text x="748" y="129" class="mono" font-size="11" fill="#86867F">claude · ~/design-system</text>
  <text x="1128" y="129" text-anchor="end" class="mono" font-size="11" fill="#86867F">figma ↔ code</text>
  <line x1="724" y1="143.5" x2="1152" y2="143.5" stroke="#2A2A30"/>
  <g class="mono" font-size="12" fill="#D9D9D4">
    <text xml:space="preserve" x="748" y="169"><tspan fill="#86867F">❯</tspan> <tspan fill="#F4F4F5">/gitma</tspan></text>
    <text xml:space="preserve" x="748" y="191"><tspan fill="#8FD19E">✓</tspan> 15 in sync</text>
    <text xml:space="preserve" x="748" y="213"><tspan fill="#E8B85A">↓</tspan> Button  <tspan fill="#E8B85A">+size=xl</tspan>   <tspan fill="#86867F">Figma</tspan></text>
    <text xml:space="preserve" x="748" y="235"><tspan fill="#C9A0D6">↑</tspan> Card    <tspan fill="#C9A0D6">+elevated</tspan>  <tspan fill="#86867F">code</tspan></text>
    <text xml:space="preserve" x="748" y="257"><tspan fill="#86867F">❯</tspan> <tspan fill="#F4F4F5">pull figma</tspan></text>
  </g>

  <!-- source file -->
  <g filter="url(#shadow)">
    <rect x="724" y="295" width="428" height="218" rx="14" fill="#18181B"/>
  </g>
  <text x="748" y="325" class="mono" font-size="12" fill="#A1A1AA">src/components/Button.tsx</text>
  <text x="1098" y="325" text-anchor="end" class="mono" font-size="12" fill="#4ADE80">+1</text>
  <text x="1128" y="325" text-anchor="end" class="mono" font-size="12" fill="#F87171">−1</text>
  <line x1="724" y1="341.5" x2="1152" y2="341.5" stroke="#2A2A30"/>

  <g class="mono" font-size="12">
    <text xml:space="preserve" x="748" y="369" fill="#52525B">12</text>
    <text xml:space="preserve" x="780" y="369" fill="#71717A">export interface ButtonProps {</text>
    <text xml:space="preserve" x="748" y="393" fill="#52525B">13</text>
    <text xml:space="preserve" x="780" y="393" fill="#71717A">  label: string;</text>

    <rect x="724" y="402" width="428" height="23" fill="#F87171" fill-opacity="0.12"/>
    <text xml:space="preserve" x="748" y="417" fill="#F87171">−</text>
    <text xml:space="preserve" x="780" y="417" fill="#FCA5A5">  size?: "sm" | "md" | "lg";</text>

    <rect x="724" y="426" width="428" height="23" fill="#4ADE80" fill-opacity="0.12"/>
    <text xml:space="preserve" x="748" y="441" fill="#4ADE80">+</text>
    <text xml:space="preserve" x="780" y="441" fill="#86EFAC">  size?: "sm" | "md" | "lg" | "xl";</text>

    <text xml:space="preserve" x="748" y="465" fill="#52525B">15</text>
    <text xml:space="preserve" x="780" y="465" fill="#71717A">  onClick?: () =&gt; void;</text>
    <text xml:space="preserve" x="748" y="489" fill="#52525B">16</text>
    <text xml:space="preserve" x="780" y="489" fill="#71717A">}</text>
  </g>

  <text x="724" y="553" class="sans" font-size="14" fill="#56534D">A designer adds size xl in Figma.</text>
  <text x="724" y="575" class="sans" font-size="14" fill="#8C8880">The type gets it, the render logic stays as it was.</text>
</svg>
